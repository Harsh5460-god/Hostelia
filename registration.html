<body>

<header class="site-header">

        <a href="registration.html" class="auth-register">Register</a>
        <a href="login.php" class="auth-login">Student Login</a>
    </div>
</header>



    <!-- ================= MAIN CONTENT ================= -->

    <main class="container main-content">

        <div class="content-area w-100">

            <span class="section-label">
                APPLICATION
            </span>

            <h2>
                Student Registration
            </h2>

            <p class="intro-text">
                Fill out the application form below to request
                hostel accommodation for the upcoming semester.
            </p>


            <!-- ================= REGISTRATION FORM ================= -->

            <form action="register.php"
                  method="POST"
                  class="registration-form">

                <div class="row g-3">


                    <!-- Full Name -->

                    <div class="col-md-6">

                        <label for="fullName"
                               class="form-label text-secondary small fw-medium">

                            Full Name

                        </label>

                        <input type="text"
                               class="form-control"
                               id="fullName"
                               name="full_name"
                               placeholder="Enter full name"
                               required>

                    </div>


                    <!-- Student ID -->

                    <div class="col-md-6">

                        <label for="studentId"
                               class="form-label text-secondary small fw-medium">

                            Student ID

                        </label>

                        <input type="text"
                               class="form-control"
                               id="studentId"
                               name="student_id"
                               placeholder="e.g. STU12345"
                               required>

                    </div>


                    <!-- Email -->

                    <div class="col-md-6">

                        <label for="email"
                               class="form-label text-secondary small fw-medium">

                            Email Address

                        </label>

                        <input type="email"
                               class="form-control"
                               id="email"
                               name="email"
                               placeholder="student@example.com"
                               required>

                    </div>

                    
                    <!-- Password -->
                    <div class="col-md-6">
                        <label for="password"
                               class="form-label text-secondary small fw-medium">
                             Password
                        </label>

                        <input type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                placeholder="Create a password"
                                minlength="8"
                                autocomplete="new-password"
                                required>
                     </div>

                    <!-- Confirm Password -->
                    <div class="col-md-6">
                        <label for="confirm_password"
                                class="form-label text-secondary small fw-medium">
                             Confirm Password
                       </label>

                       <input type="password"
                                class="form-control"
                                id="confirm_password"
                                name="confirm_password"
                                placeholder="Re-enter your password"
                                minlength="8"
                                autocomplete="new-password"
                                required>
                    </div>



                    <!-- Phone -->

                    <div class="col-md-6">

                        <label for="phone"
                               class="form-label text-secondary small fw-medium">

                            Phone Number

                        </label>

                        <input type="tel"
                               class="form-control"
                               id="phone"
                               name="phone"
                               placeholder="+91 9876543210"
                               required>

                    </div>


                    <!-- Gender -->

                    <div class="col-md-6">

                        <label for="gender"
                               class="form-label text-secondary small fw-medium">

                            Gender

                        </label>

                        <select class="form-select"
                                id="gender"
                                name="gender"
                                required>

                            <option value="" selected disabled>
                                Select gender
                            </option>

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- Room Type -->

                    <div class="col-md-6">

                        <label for="roomType"
                               class="form-label text-secondary small fw-medium">

                            Preferred Room Type

                        </label>

                        <select class="form-select"
                                id="roomType"
                                name="room_type"
                                required>

                            <option value="" selected disabled>
                                Select room type
                            </option>

                            <option value="Single Occupancy">
                                Single Occupancy
                            </option>

                            <option value="Double Sharing">
                                Double Sharing
                            </option>

                            <option value="Triple Sharing">
                                Triple Sharing
                            </option>

                            <option value="Deluxe Suite">
                                Deluxe Suite
                            </option>

                        </select>

                    </div>


                    <!-- Address -->

                    <div class="col-12">

                        <label for="address"
                               class="form-label text-secondary small fw-medium">

                            Permanent Address

                        </label>

                        <textarea class="form-control"
                                  id="address"
                                  name="address"
                                  rows="3"
                                  placeholder="Enter residential address"
                                  required></textarea>

                    </div>


                    <!-- Submit Button -->

                    <div class="col-12 mt-4">

                        <button type="submit"
                                class="submit-btn w-100">

                            SUBMIT APPLICATION

                        </button>

                    </div>

                </div>

            </form>

        </div>
